[server]
headless = true
# App publico: manter CORS e protecao XSRF ligados (padrao do Streamlit)
enableCORS = true
enableXsrfProtection = true

[theme]
base = "light"
primaryColor = "#0047bb"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#1e293b"
font = "sans serif"

[client]
# Nao mostrar traceback com caminhos internos ao visitante; o detalhe
# continua no log do servidor
showErrorDetails = false
